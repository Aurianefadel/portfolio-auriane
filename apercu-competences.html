<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Aperçu — Mes Compétences</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --accent: #E7473C; --bg: #FDF8F0; --heading: #2c2c2c; }
        * { box-sizing: border-box; }
        body { background: var(--bg); font-family: "Raleway", sans-serif; color: var(--heading); margin: 0; padding: 2rem 1.5rem 5rem; }
        .wrap { max-width: 1100px; margin: 0 auto; }
        h1.main { text-align: center; font-weight: 800; font-size: 1.4rem; margin-bottom: 2.5rem; color: #777; }
        .variant { margin-bottom: 4rem; }
        .variant > h2 { text-transform: uppercase; font-weight: 800; font-size: 1.5rem; text-align: center; margin: 0 0 0.3rem; }
        .variant > .tag { text-align: center; color: var(--accent); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.05em; margin-bottom: 1.6rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 2.5rem; }
        @media (max-width: 760px){ .grid { grid-template-columns: 1fr; } }
        .sk-name { font-weight: 700; color: var(--heading); }
        .sk-desc { color: #777; line-height: 1.35; }

        /* ===== VERSION ACTUELLE ===== */
        .v-current .grid { gap: 1rem 1.5rem; }
        .v-current .sk-item { background:#fff; border-radius:15px; padding:1.2rem 1.5rem; box-shadow:0 5px 25px rgba(0,0,0,.08); display:flex; align-items:center; gap:1rem; }
        .v-current .sk-icon { width:50px; height:50px; min-width:50px; background:linear-gradient(135deg,var(--accent),#ff5a4d); border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.5rem; box-shadow:0 5px 15px rgba(231,71,60,.3); }
        .v-current .sk-name { font-size:1rem; margin-bottom:.2rem; }
        .v-current .sk-desc { font-size:.85rem; }

        /* ===== OPTION A — ÉPURÉ (sans cartes, lignes fines) ===== */
        .v-a .grid { gap: 0 2.5rem; }
        .v-a .sk-item { display:flex; align-items:flex-start; gap:.9rem; padding:.9rem 0; border-bottom:1px solid rgba(0,0,0,.08); }
        .v-a .sk-icon { width:34px; height:34px; min-width:34px; display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:1rem; background:color-mix(in srgb, var(--accent) 12%, transparent); border-radius:50%; }
        .v-a .sk-name { font-size:.98rem; margin-bottom:.15rem; }
        .v-a .sk-desc { font-size:.82rem; }

        /* ===== OPTION B — CARTES PLATES (légères) ===== */
        .v-b .sk-item { background:#fff; border:1px solid rgba(0,0,0,.07); border-radius:10px; padding:.85rem 1rem; display:flex; align-items:center; gap:.85rem; box-shadow:none; }
        .v-b .sk-icon { width:38px; height:38px; min-width:38px; display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:1.05rem; background:color-mix(in srgb, var(--accent) 12%, transparent); border-radius:9px; }
        .v-b .sk-name { font-size:.95rem; margin-bottom:.12rem; }
        .v-b .sk-desc { font-size:.8rem; }

        /* ===== OPTION C — COMPACT MINIMAL (icône + titre en ligne) ===== */
        .v-c .grid { gap:.2rem 3rem; }
        .v-c .sk-item { padding:.55rem 0; border-bottom:1px solid rgba(0,0,0,.06); }
        .v-c .sk-head { display:flex; align-items:center; gap:.6rem; }
        .v-c .sk-icon { color:var(--accent); font-size:1rem; width:1.3rem; text-align:center; }
        .v-c .sk-name { font-size:.97rem; }
        .v-c .sk-desc { font-size:.8rem; margin-top:.1rem; padding-left:1.9rem; }
    </style>
</head>
<body>
<div class="wrap">
    <h1 class="main">Aperçu — 3 alternatives pour la section « Mes Compétences »<br>(la version actuelle est tout en bas)</h1>

    <div class="variant v-a" id="va"><h2>Mes Compétences</h2><div class="tag">OPTION A — Épuré (sans cartes)</div><div class="grid"></div></div>
    <div class="variant v-b" id="vb"><h2>Mes Compétences</h2><div class="tag">OPTION B — Cartes plates &amp; légères</div><div class="grid"></div></div>
    <div class="variant v-c" id="vc"><h2>Mes Compétences</h2><div class="tag">OPTION C — Compact minimal</div><div class="grid"></div></div>
    <div class="variant v-current" id="vcur"><h2>Mes Compétences</h2><div class="tag" style="color:#999">VERSION ACTUELLE (pour comparaison)</div><div class="grid"></div></div>
</div>

<script>
    const skills = [
        ["fa-video","Réalisation Vidéo","Création de contenus vidéo professionnels et créatifs."],
        ["fa-palette","Étalonnage de base (Première Pro)","Correction colorimétrique et ambiance visuelle."],
        ["fa-scissors","Montage (Première Pro)","Édition vidéo professionnelle et narrative."],
        ["fa-layer-group","Notions en Motion design","Animations graphiques et effets visuels de base, connaissance d'after effects."],
        ["fa-camera","Photographie","Captation d'événements et portraits artistiques."],
        ["fa-comment","Maîtrise de l'anglais","EF SET English Certificate 68/100 (C1 Advanced)."],
        ["fa-wand-magic-sparkles","Retouches photo et créations graphiques","Post-production et optimisation d'images. Créations d'affiches, logos et éléments graphiques."],
        ["fa-laptop","Créations et maintenance de sites Wix",""]
    ];

    function render(id, compact){
        const grid = document.querySelector("#"+id+" .grid");
        grid.innerHTML = skills.map(([ic,name,desc]) => {
            if (compact) {
                return `<div class="sk-item">
                    <div class="sk-head"><i class="fa-solid ${ic} sk-icon"></i><div class="sk-name">${name}</div></div>
                    ${desc ? `<div class="sk-desc">${desc}</div>` : ""}
                </div>`;
            }
            return `<div class="sk-item">
                <div class="sk-icon"><i class="fa-solid ${ic}"></i></div>
                <div class="sk-text"><div class="sk-name">${name}</div>${desc ? `<div class="sk-desc">${desc}</div>` : ""}</div>
            </div>`;
        }).join("");
    }
    render("va", false);
    render("vb", false);
    render("vc", true);
    render("vcur", false);
</script>
</body>
</html>
